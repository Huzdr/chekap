name: Bug report / Повідомлення про помилку
description: Chekap fails, or a finding is wrong / Chekap не працює або знахідка хибна
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please use invented names instead of real ones: `PC-042`, `contoso.local`, `192.0.2.x`.
        Дякуємо за повідомлення. Будь ласка, замініть справжні імена вигаданими: `PC-042`, `contoso.local`, `192.0.2.x`.

        A report file contains the name of the PC, its IP addresses and its printers. Look through it before you attach it.
        У файлі звіту є ім'я ПК, його IP-адреси та принтери. Перегляньте його, перш ніж додавати.
  - type: input
    id: chekap-version
    attributes:
      label: Chekap version / Версія Chekap
      description: "Run: (Get-Module Chekap).Version"
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: powershell-version
    attributes:
      label: PowerShell version / Версія PowerShell
      description: "Run: $PSVersionTable.PSVersion (Windows PowerShell 5.1 or PowerShell 7)"
      placeholder: 5.1.19041.5486
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and edition / Версія й редакція Windows
      description: "For example: Windows 11 Pro 23H2, Windows Server 2022. Run winver / Наприклад, Windows 11 Pro 23H2. Виконайте winver"
    validations:
      required: true
  - type: dropdown
    id: windows-language
    attributes:
      label: Language of Windows / Мова Windows
      options:
        - Українська / Ukrainian
        - English
        - Other / Інша
    validations:
      required: true
  - type: dropdown
    id: chekap-language
    attributes:
      label: Language of Chekap (-Language) / Мова Chekap (-Language)
      options:
        - uk
        - en
        - Not set, from Windows / Не вказано, з Windows
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual result / Кроки, очікуваний і фактичний результат
      description: What you ran, what you expected and what happened instead. / Що ви запускали, чого чекали і що сталося.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error text / Вивід або текст помилки
      description: "Paste it as text, not as a picture. Run with -Verbose if you can. Replace real names first. / Вставте текстом, не зображенням. За можливості запустіть з -Verbose. Спершу замініть справжні імена."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Конфіденційність
      options:
        - label: I replaced real computer names, IP addresses and user names. / Я замінив(ла) справжні імена комп'ютерів, IP-адреси та імена користувачів.
          required: true
